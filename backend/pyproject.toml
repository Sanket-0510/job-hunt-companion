[project]
name = "job-companion-backend"
version = "0.1.0"
description = "Job Hunt Companion API and worker"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "authlib>=1.9.1",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "procrastinate[psycopg]>=3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pydantic[email]>=2.14.1",
    "pypdf>=6.21.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff.lint.isort]
# The local alembic/ folder makes ruff treat the alembic package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations embed long SQL expressions.
"alembic/versions/*" = ["E501"]
# Message templates are user-facing text, kept verbatim from the spec.
"app/modules/jobs/messages.py" = ["E501"]
